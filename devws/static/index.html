<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Developer Workspace Manager</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%82%EF%B8%8F%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-left">
      <span class="app-mark">🗂️</span>
      <h1 class="app-title">Workspaces</h1>
      <div id="workspace-switcher"></div>
    </div>
    <div class="toolbar-right">
      <button class="btn btn-quiet" id="btn-ports" title="All listening ports">Ports</button>
      <button class="btn btn-quiet" id="btn-settings" title="Settings">Settings</button>
      <button class="btn btn-primary" id="btn-new-workspace">New Workspace</button>
    </div>
  </header>

  <main id="view">
    <!-- Setup (first run): choose the directory that holds project folders -->
    <section id="setup" class="setup hidden">
      <div class="setup-card">
        <div class="setup-icon">🗂️</div>
        <h2>Welcome</h2>
        <p class="setup-sub">Choose the folder that contains your projects. Each subfolder becomes a project you can manage — terminals, editors, dev servers, Docker Compose, Git status, and ports.</p>

        <label class="field-label" for="ws-name">Workspace name</label>
        <div class="field"><input id="ws-name" type="text" placeholder="My Projects" spellcheck="false"></div>

        <label class="field-label">Projects folder</label>
        <div class="browser" id="dir-browser">
          <div class="browser-path" id="browser-path"></div>
          <ul class="browser-list" id="browser-list"></ul>
        </div>

        <button class="btn btn-primary btn-large" id="btn-create-workspace" disabled>Create Workspace</button>
        <p class="setup-error hidden" id="setup-error"></p>
      </div>
    </section>

    <!-- Dashboard -->
    <section id="dashboard" class="hidden">
      <div class="dash-head">
        <div>
          <h2 id="dash-title"></h2>
          <p class="dash-sub" id="dash-root"></p>
        </div>
        <button class="btn btn-quiet" id="btn-refresh">Refresh</button>
      </div>
      <div class="grid" id="project-grid"></div>
      <p class="empty hidden" id="dash-empty">No project folders found in this workspace’s directory.</p>
    </section>
  </main>

  <!-- Modal host -->
  <div class="modal-backdrop hidden" id="modal-backdrop">
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toast-host" id="toast-host"></div>

  <script src="/app.js"></script>
</body>
</html>
